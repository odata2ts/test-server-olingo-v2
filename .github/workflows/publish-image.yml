name: Publish Image

# Publishes the runnable test server to the GitHub Container Registry.
#
# Consumers pin an exact version - `ghcr.io/odata2ts/test-server-olingo-v2:0.1.0` - and start it as a
# throwaway container; see odata2ts/odata2ts, int-test/olingo-v2. `latest` is still republished from every
# push to main for ad-hoc use, but nothing automated consumes it any more.
#
# release-please runs as a job here rather than this workflow being triggered by the tag it pushes:
# GitHub does not start workflows from events made with GITHUB_TOKEN, so that tag would build nothing.
# Running it first also means a released commit is built exactly once, carrying `latest` and the version
# tags on one image, instead of two builds producing two digests for identical source.

# The branch is not pinned by name on purpose. A hardcoded name means the workflow silently stops
# firing the day the default branch is renamed - which is exactly what happened here, the default was
# `feat/library-test-model` until recently. Instead every push arrives and the job itself decides, by
# comparing against the repository's actual default branch - see the `if:` below.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  # a newer commit on main makes an in-flight publish pointless
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Opens and maintains the release PR; merging that PR makes the next run of this job cut the release
  # and hand the version to `publish` below. Runs on the default branch only, so on every other branch
  # it is skipped - which is why `publish` tests `result != 'failure'` instead of relying on `needs:`
  # alone, a skipped dependency would otherwise skip the publish too.
  release:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-please reads the whole history to work out the next version

      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    # Publish from the default branch only. Feature branches skip immediately.
    if: >-
      !cancelled() && needs.release.result != 'failure' &&
      (github.ref_name == github.event.repository.default_branch ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only from the default branch; a run that cut a release additionally yields
          # 0.1.0 / 0.1 / 0, read from the release job rather than from the git ref
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag_name }},enable=${{ needs.release.outputs.released == 'true' }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: test-server-olingo-v2:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A published image that does not actually serve the model is worse than none, so it is
      # smoke-tested before it is pushed. The three checks are the three things most likely to break:
      # the metadata document (hand-written EdmProvider), a derived type carrying its inherited
      # properties, and an operation - Olingo dispatches those through a separate path.
      - name: Smoke-test the image
        run: |
          docker run -d --name verify -p 4004:4004 test-server-olingo-v2:verify
          for i in $(seq 1 60); do
            curl -sfS http://localhost:4004/odata/v2/library/ > /dev/null && break
            sleep 2
          done
          curl -sfS 'http://localhost:4004/odata/v2/library/$metadata' | grep -q 'DataServiceVersion="2.0"'
          curl -sfS 'http://localhost:4004/odata/v2/library/$metadata' | grep -q 'BaseType="Library.Catalog.Magazine"'
          # a TradeJournal is four levels down; ISBN comes from PrintMedium, Title from Medium
          curl -sfS -H 'Accept: application/json' \
            'http://localhost:4004/odata/v2/library/TradeJournals?$top=1' | grep -q '"ISBN"'
          count=$(curl -sfS -H 'Accept: application/json' \
            'http://localhost:4004/odata/v2/library/TotalMediaCount' | grep -o '"TotalMediaCount":"[0-9]*"')
          echo "TotalMediaCount -> $count"
          test -n "$count"
          docker rm -f verify

      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
